version: '3'

env:
  JAVA_HOME: /Applications/Android Studio.app/Contents/jbr/Contents/Home

vars:
  SDK_PATH: ~/Library/Android/sdk/build-tools/36.1.0

tasks:
  build:
    desc: Build debug APK
    cmds:
      - ./gradlew assembleDebug

  build:release:
    desc: Build signed release APK
    cmds:
      - ./gradlew assembleRelease
      - '{{ .SDK_PATH }}/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/meld-release-unsigned.apk'
      - '{{ .SDK_PATH }}/apksigner sign --ks meld-release-key.jks --out app/build/outputs/apk/release/meld.apk app/build/outputs/apk/release/meld-release-unsigned.apk'

  build:release:ci:
    desc: Build signed release APK for CI (reads signing config from env vars)
    cmds:
      - ./gradlew assembleRelease
      - '{{ .SDK_PATH }}/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/meld-release-unsigned.apk'
      - '{{ .SDK_PATH }}/apksigner sign --verbose --ks "$KEYSTORE_PATH" --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --in app/build/outputs/apk/release/meld-release-unsigned.apk --out app/build/outputs/apk/release/meld.apk'

  test:
    desc: Run JVM unit tests
    cmds:
      - ./gradlew test

  test:android:
    desc: Run instrumented tests (requires connected device or emulator)
    cmds:
      - ./gradlew connectedAndroidTest

  install:
    desc: Build and install debug APK on connected device
    cmds:
      - ./gradlew installDebug

  check:
    desc: Run lint and unit tests
    cmds:
      - ./gradlew lint test

  clean:
    desc: Clean build artifacts
    cmds:
      - ./gradlew clean
