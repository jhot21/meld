version: '3'

env:
  JAVA_HOME: /Applications/Android Studio.app/Contents/jbr/Contents/Home

vars:
  SDK_PATH: ~/Library/Android/sdk/build-tools/36.1.0
  APP_NAME: meld

includes:
  android-common:
    taskfile: https://codeberg.org/jhot/taskfiles/raw/branch/main/android.yaml
    flatten: true

tasks:
  sync-build-gradle:
    desc: Ensure app/build.gradle.kts reads version numbers from gradle.properties
    status:
      - grep -q 'findProperty("VERSION_CODE")' app/build.gradle.kts
    cmds:
      - "sed -i '' 's/versionCode = [0-9]*/versionCode = (findProperty(\"VERSION_CODE\") as String?)?.toInt() ?: 1/' app/build.gradle.kts"
      - "sed -i '' 's/versionName = \".*\"/versionName = (findProperty(\"VERSION_NAME\") as String?) ?: \"1.0\"/' app/build.gradle.kts"
